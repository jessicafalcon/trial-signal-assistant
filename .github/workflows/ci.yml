name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pre-commit==4.6.2
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # duckdb: the RAG unit tests execute the mart's flatten/md5 SQL
      # expressions in-memory; pyyaml: they validate the committed
      # golden set — still no network, no model downloads
      - run: pip install pytest==9.1.1 requests==2.34.2 pyarrow==25.0.1 duckdb==1.5.5 pyyaml==6.0.3
      - run: make test PYTEST=pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install dbt-core==1.12.2 dbt-duckdb==1.11.0 pyarrow==25.0.1 requests==2.34.2
      # CI has no data/raw/ — the fixtures are the corpus here, landed in
      # their own root so they can never masquerade as a real partition.
      # The symlink maps them into the source's fixed read path; the SQL
      # itself is never parameterized (injection surface).
      - run: make parse FIXTURES=1 PY=python
      - run: ln -s parsed_fixtures data/parsed
      # change-detection machinery end to end on the fixture corpus:
      # synthetic day-0 seed (fixture-scoped variant — the fixture corpus
      # has no RECRUITING trial, so the corpus seed can't transition
      # there) → live snapshot → full build → idempotency proof.
      - run: make snapshot-day0 FIXTURES=1 DBT=dbt
      - run: make snapshot DBT=dbt
      - run: make dbt DBT=dbt
      - run: make verify-idempotent DBT=dbt PY=python
      - run: make verify-day0-count DBT=dbt PY=python

  # DAG integrity without Docker/Airflow-runtime/credentials: pure
  # Python DagBag import + structure checks. airflow is a test-only
  # dep isolated in airflow/requirements-dagtest.txt (owner ruling) —
  # its own job so the fast test job's env stays unchanged.
  dag-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pytest==9.1.1
      # PY drives the constraints-file version probe (3.11 here)
      - run: make dag-verify PYTEST=pytest PIP=pip PY=python

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.15.8"
      - run: terraform -chdir=terraform fmt -check -recursive
      # init only downloads the lock-file-pinned providers (registry
      # mirror); no backend, NO credentials, no plan/apply — AWS and
      # Snowflake are never touched in CI, by policy.
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # the floor scans full history
          persist-credentials: false
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv ./gitleaks /usr/local/bin/
      - run: ./scripts/secrets_audit.sh  # all floor checks, not just gitleaks
      # .gitleaks.toml is otherwise self-governing: a PR widening the
      # allowlist would disable the check for its own diff. On PRs, rerun
      # the full-history scan with the BASE branch's config, so an
      # allowlist change can never mask the token it was added alongside
      # (it fails here and forces human review). .gitignore needs no
      # twin guard: floor checks (a)/(b)/(e) scan the index and history
      # directly and don't consult .gitignore at all.
      - name: gitleaks with base-branch config (self-governance guard)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${GITHUB_BASE_REF}:.gitleaks.toml" > "${RUNNER_TEMP}/base-gitleaks.toml"
          gitleaks git . --redact --no-banner --config "${RUNNER_TEMP}/base-gitleaks.toml"
      # scripts/secrets_audit.sh is equally self-governing: a PR
      # weakening its checks (path exclusions, patterns, the pin) would
      # pass its own diff. Run the BASE branch's copy of the script too
      # — same pattern as the config guard above. The doubled
      # full-history scan cost is accepted (phase-7 ruling 4).
      - name: secrets floor with base-branch script (self-governance guard)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${GITHUB_BASE_REF}:scripts/secrets_audit.sh" > "${RUNNER_TEMP}/base-secrets-audit.sh"
          bash "${RUNNER_TEMP}/base-secrets-audit.sh"
