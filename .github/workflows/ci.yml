name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit==4.6.2
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==9.1.1 requests==2.34.2 pyarrow==25.0.1
      - run: make test PYTEST=pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-core==1.12.2 dbt-duckdb==1.11.0 pyarrow==25.0.1 requests==2.34.2
      # CI has no data/raw/ — the fixtures are the corpus here, landed in
      # their own root so they can never masquerade as a real partition.
      # The symlink maps them into the source's fixed read path; the SQL
      # itself is never parameterized (injection surface).
      - run: make parse FIXTURES=1 PY=python
      - run: ln -s parsed_fixtures data/parsed
      # change-detection machinery end to end on the fixture corpus:
      # synthetic day-0 seed (fixture-scoped variant — the fixture corpus
      # has no RECRUITING trial, so the corpus seed can't transition
      # there) → live snapshot → full build → idempotency proof.
      - run: make snapshot-day0 FIXTURES=1 DBT=dbt
      - run: make snapshot DBT=dbt
      - run: make dbt DBT=dbt
      - run: make verify-idempotent DBT=dbt PY=python
      - run: make verify-day0-count DBT=dbt PY=python

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform -chdir=terraform fmt -check -recursive
      # init only downloads the lock-file-pinned providers (registry
      # mirror); no backend, NO credentials, no plan/apply — AWS and
      # Snowflake are never touched in CI, by policy.
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the floor scans full history
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv ./gitleaks /usr/local/bin/
      - run: ./scripts/secrets_audit.sh  # all four floor checks, not just gitleaks
