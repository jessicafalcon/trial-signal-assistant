name: trial_signal
version: "1.0.0"
profile: trial_signal

# no outbound calls from dbt runs — CI and local builds are network-free
flags:
  send_anonymous_usage_stats: false

# single source of truth for the registry status enum (2026-08-14
# corpus); referenced by every accepted_values test on a status column
vars:
  # circuit breaker (R1): min ratio of latest-partition rows to the
  # prior partition's before the snapshot may run. 0.8 because the AD
  # corpus moves by single-digit counts a day (registrations outpace
  # delistings; the registry rarely removes studies), so a >=20%
  # overnight drop is an ingest failure, not registry reality.
  circuit_breaker_min_ratio: 0.8
  trial_status_enum:
    - COMPLETED
    - RECRUITING
    - UNKNOWN
    - TERMINATED
    - ACTIVE_NOT_RECRUITING
    - NOT_YET_RECRUITING
    - WITHDRAWN
    - ENROLLING_BY_INVITATION
    - AVAILABLE
    - NO_LONGER_AVAILABLE
    - SUSPENDED

model-paths: ["models"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  trial_signal:
    staging:
      +materialized: view
    marts:
      +materialized: table
