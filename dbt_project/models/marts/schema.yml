version: 2

models:
  - name: mart_field_completeness
    description: >
      One row per ingest_date: how complete the corpus is on the fields
      the downstream RAG layer depends on. Percentages are 0-100,
      rounded to 2 decimals. Numeric data_types below are duckdb's
      (bigint/double); the snowflake target surfaces NUMBER — values
      are identical (parity verified 2026-08-15).
    columns:
      - name: ingest_date
        data_type: date
        description: Raw-landing partition date.
        data_tests:
          - unique
          - not_null
      - name: total_studies
        data_type: bigint
        description: Studies parsed in this partition.
      - name: pct_with_results
        data_type: double
        description: Share of studies with posted results.
      - name: pct_withdrawn_or_terminated_with_why_stopped
        data_type: double
        description: >
          Among WITHDRAWN or TERMINATED studies, share with a non-empty
          why_stopped text; null if the partition has none of either
          status.
      - name: pct_date_precision_day
        data_type: double
        description: Share of studies with a day-precision start date.
      - name: pct_date_precision_month
        data_type: double
        description: Share of studies with a month-precision start date.
      - name: pct_date_absent
        data_type: double
        description: >
          Share of studies with no start date sent at all. A raw date in
          an unrecognized format (none in the current corpus) counts in
          no pct_date_* bucket, so the three need not sum to 100.

  - name: mart_trial_documents
    description: >
      RAG document corpus: one row per (nct_id, doc_field) over the
      latest ingest partition, for each non-empty text field
      (brief_summary, detailed_description, why_stopped). The embedder's
      sole input surface; content_hash is its incremental change key.
      duckdb-only — excluded on the snowflake target with the snapshot
      machinery. Grain uniqueness asserted by
      tests/assert_mart_trial_documents_grain.sql.
    columns:
      - name: nct_id
        data_type: varchar
        description: ClinicalTrials.gov registry identifier.
        data_tests:
          - not_null
      - name: doc_field
        data_type: varchar
        description: Which TrialRecord text field this document holds.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - brief_summary
                  - detailed_description
                  - why_stopped
      - name: doc_text
        data_type: varchar
        description: >
          The document text, stored trimmed; never null or
          whitespace-only (content_hash is md5 of this trimmed text).
        data_tests:
          - not_null
      - name: overall_status
        data_type: varchar
        description: Recruitment/lifecycle status (Chroma metadata filter).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('trial_status_enum') }}"
      - name: phase
        data_type: varchar
        description: >
          Trial phase(s) joined with "/"; '' when the API sent none
          ('NA' is a real registry value and cannot mark absence).
        data_tests:
          - not_null
      - name: sponsor_name
        data_type: varchar
        description: Lead sponsor name; '' when absent.
        data_tests:
          - not_null
      - name: has_results
        data_type: boolean
        description: Whether the registry has posted results.
        data_tests:
          - not_null
      - name: conditions_flat
        data_type: varchar
        description: >
          Conditions array joined with '; ' (F8 flattening rule — Chroma
          metadata values must be scalars); '' for an empty array.
        data_tests:
          - not_null
      - name: content_hash
        data_type: varchar
        description: >
          md5 of doc_text — the F8 incremental change key the embedder
          compares against Chroma's stored metadata.
        data_tests:
          - not_null
      - name: ingest_date
        data_type: date
        description: The latest partition date (single value here).
        data_tests:
          - not_null

  - name: mart_trial_status_changes
    description: >
      One row per detected overall_status transition, read from the
      snapshot's SCD2 history: consecutive versions of the same nct_id
      paired into (prior, new). prior_source/new_source expose capture
      provenance, so transitions whose prior state was the synthetic
      day-0 seed are visibly labeled in the mart itself.
    columns:
      - name: nct_id
        data_type: varchar
        description: ClinicalTrials.gov registry identifier.
        data_tests:
          - not_null
      - name: prior_status
        data_type: varchar
        description: overall_status before the transition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('trial_status_enum') }}"
      - name: new_status
        data_type: varchar
        description: overall_status after the transition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('trial_status_enum') }}"
      - name: changed_detected_at
        data_type: timestamp
        description: >
          dbt_valid_from of the new SCD2 row — when the snapshot run
          observed the change, not when the registry made it.
        data_tests:
          - not_null
      - name: prior_source
        data_type: varchar
        description: Capture provenance of the prior state.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - live
                  - synthetic_day0
      - name: new_source
        data_type: varchar
        description: Capture provenance of the new state.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - live
                  - synthetic_day0
