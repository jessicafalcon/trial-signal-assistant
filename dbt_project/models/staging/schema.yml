version: 2

models:
  - name: stg_clinical_trials
    description: >
      Typed pass-through over the parsed Parquet source. No renames, no
      computed fields — parsing rules live only in the Python parser.
    columns:
      - name: nct_id
        data_type: varchar
        description: ClinicalTrials.gov registry identifier (NCTxxxxxxxx).
        data_tests:
          - unique
          - not_null
      - name: brief_title
        data_type: varchar
        description: Short public title of the study.
      - name: overall_status
        data_type: varchar
        description: >
          Recruitment/lifecycle status as reported by the API. Values
          enumerated from the 2026-08-14 corpus (1,738 AD studies).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - RECRUITING
                  - UNKNOWN
                  - TERMINATED
                  - ACTIVE_NOT_RECRUITING
                  - NOT_YET_RECRUITING
                  - WITHDRAWN
                  - ENROLLING_BY_INVITATION
                  - AVAILABLE
                  - NO_LONGER_AVAILABLE
                  - SUSPENDED
      - name: phase
        data_type: varchar
        description: >
          Trial phase(s) joined with "/" (e.g. PHASE1/PHASE2); "NA" means
          not applicable; null when absent.
      - name: sponsor_name
        data_type: varchar
        description: Lead sponsor name.
      - name: conditions
        data_type: varchar[]
        description: List of condition strings; empty list when absent.
      - name: interventions
        data_type: varchar[]
        description: List of intervention names; empty list when absent.
      - name: start_date_raw
        data_type: varchar
        description: Start date exactly as the API sent it; null if absent.
      - name: start_date
        data_type: date
        description: >
          Normalized start date (month precision resolves to first of
          month); null when absent or unparseable.
      - name: date_precision
        data_type: varchar
        description: >
          Precision of start_date_raw — "day" or "month"; null when the
          date is absent or in an unrecognized format.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - day
                  - month
              config:
                where: "date_precision is not null"
      - name: why_stopped
        data_type: varchar
        description: >
          Free-text stop reason; present only on some withdrawn/terminated
          trials.
      - name: has_results
        data_type: boolean
        description: Whether the registry has posted results.
        data_tests:
          - not_null
      - name: ingest_date
        data_type: date
        description: Raw-landing partition date this row was parsed from.
        data_tests:
          - not_null
