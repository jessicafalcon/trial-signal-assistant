version: 2

# Shared column descriptions live in _docs.md as doc blocks — referenced
# here via {{ doc('...') }} so the two models' copies cannot drift.

models:
  - name: stg_clinical_trials
    description: >
      Typed pass-through over the parsed Parquet source. No renames, no
      computed fields — parsing rules live only in the Python parser.
      Grain: one row per (nct_id, ingest_date) — all ingest partitions
      are kept as a time series (2026-08-14 grain ruling, DECISIONS.md);
      uniqueness at that grain is asserted by the singular test
      tests/assert_stg_clinical_trials_grain.sql.
    columns:
      - name: nct_id
        data_type: varchar
        description: >
          ClinicalTrials.gov registry identifier (NCTxxxxxxxx). Unique
          only within one ingest_date partition, not across the model.
        data_tests:
          - not_null
      - name: brief_title
        data_type: varchar
        description: "{{ doc('trial_brief_title') }}"
      - name: overall_status
        data_type: varchar
        description: "{{ doc('trial_overall_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('trial_status_enum') }}"
      - name: phase
        data_type: varchar
        description: "{{ doc('trial_phase') }}"
      - name: sponsor_name
        data_type: varchar
        description: "{{ doc('trial_sponsor_name') }}"
      - name: conditions
        data_type: varchar[]
        description: "{{ doc('trial_conditions') }}"
      - name: interventions
        data_type: varchar[]
        description: "{{ doc('trial_interventions') }}"
      - name: start_date_raw
        data_type: varchar
        description: "{{ doc('trial_start_date_raw') }}"
      - name: start_date
        data_type: date
        description: "{{ doc('trial_start_date') }}"
      - name: date_precision
        data_type: varchar
        description: "{{ doc('trial_date_precision') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - day
                  - month
              config:
                where: "date_precision is not null"
      - name: why_stopped
        data_type: varchar
        description: "{{ doc('trial_why_stopped') }}"
      - name: brief_summary
        data_type: varchar
        description: "{{ doc('trial_brief_summary') }}"
      - name: detailed_description
        data_type: varchar
        description: "{{ doc('trial_detailed_description') }}"
      - name: has_results
        data_type: boolean
        description: "{{ doc('trial_has_results') }}"
        data_tests:
          - not_null
      - name: ingest_date
        data_type: date
        description: Raw-landing partition date this row was parsed from.
        data_tests:
          - not_null

  - name: stg_trials_current
    description: >
      stg_clinical_trials filtered to the latest ingest_date — input
      surface for the snapshot and (via mart_trial_documents) the RAG
      embedder. One row per nct_id (bare nct_id IS
      unique at this grain). Adds snapshot_source='live' so rows the
      snapshot captures from here are distinguishable from the synthetic
      day-0 seed all the way into the marts.
    columns:
      - name: nct_id
        data_type: varchar
        description: ClinicalTrials.gov registry identifier (NCTxxxxxxxx).
        data_tests:
          - unique
          - not_null
      - name: brief_title
        data_type: varchar
        description: "{{ doc('trial_brief_title') }}"
      - name: overall_status
        data_type: varchar
        description: "{{ doc('trial_overall_status') }}"
      - name: phase
        data_type: varchar
        description: "{{ doc('trial_phase') }}"
      - name: sponsor_name
        data_type: varchar
        description: "{{ doc('trial_sponsor_name') }}"
      - name: conditions
        data_type: varchar[]
        description: "{{ doc('trial_conditions') }}"
      - name: interventions
        data_type: varchar[]
        description: "{{ doc('trial_interventions') }}"
      - name: start_date_raw
        data_type: varchar
        description: "{{ doc('trial_start_date_raw') }}"
      - name: start_date
        data_type: date
        description: "{{ doc('trial_start_date') }}"
      - name: date_precision
        data_type: varchar
        description: "{{ doc('trial_date_precision') }}"
      - name: why_stopped
        data_type: varchar
        description: "{{ doc('trial_why_stopped') }}"
      - name: brief_summary
        data_type: varchar
        description: "{{ doc('trial_brief_summary') }}"
      - name: detailed_description
        data_type: varchar
        description: "{{ doc('trial_detailed_description') }}"
      - name: has_results
        data_type: boolean
        description: "{{ doc('trial_has_results') }}"
      - name: ingest_date
        data_type: date
        description: The latest partition date (single value here).
        data_tests:
          - not_null
      - name: snapshot_source
        data_type: varchar
        description: Constant 'live' — provenance label for the snapshot.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - live
