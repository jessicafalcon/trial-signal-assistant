version: 2

models:
  - name: stg_clinical_trials
    description: >
      Typed pass-through over the parsed Parquet source. No renames, no
      computed fields — parsing rules live only in the Python parser.
      Grain: one row per (nct_id, ingest_date) — all ingest partitions
      are kept as a time series (2026-08-14 grain ruling, DECISIONS.md);
      uniqueness at that grain is asserted by the singular test
      tests/assert_stg_clinical_trials_grain.sql.
    columns:
      - name: nct_id
        data_type: varchar
        description: >
          ClinicalTrials.gov registry identifier (NCTxxxxxxxx). Unique
          only within one ingest_date partition, not across the model.
        data_tests:
          - not_null
      - name: brief_title
        data_type: varchar
        description: Short public title of the study.
      - name: overall_status
        data_type: varchar
        description: >
          Recruitment/lifecycle status as reported by the API. Values
          enumerated from the 2026-08-14 corpus (1,738 AD studies).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('trial_status_enum') }}"
      - name: phase
        data_type: varchar
        description: >
          Trial phase(s) joined with "/" (e.g. PHASE1/PHASE2); "NA" means
          not applicable; null when absent.
      - name: sponsor_name
        data_type: varchar
        description: Lead sponsor name.
      - name: conditions
        data_type: varchar[]
        description: >
          List of condition strings; empty list when absent. data_type
          is duckdb's; on the snowflake target this column is ARRAY
          (COPY from parquet) — the one deliberate type divergence.
      - name: interventions
        data_type: varchar[]
        description: >
          List of intervention names; empty list when absent. data_type
          is duckdb's; ARRAY on the snowflake target (see conditions).
      - name: start_date_raw
        data_type: varchar
        description: Start date exactly as the API sent it; null if absent.
      - name: start_date
        data_type: date
        description: >
          Normalized start date (month precision resolves to first of
          month); null when absent or unparseable.
      - name: date_precision
        data_type: varchar
        description: >
          Precision of start_date_raw — "day" or "month"; null when the
          date is absent or in an unrecognized format.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - day
                  - month
              config:
                where: "date_precision is not null"
      - name: why_stopped
        data_type: varchar
        description: >
          Free-text stop reason; present only on some withdrawn/terminated
          trials.
      - name: has_results
        data_type: boolean
        description: Whether the registry has posted results.
        data_tests:
          - not_null
      - name: ingest_date
        data_type: date
        description: Raw-landing partition date this row was parsed from.
        data_tests:
          - not_null

  - name: stg_trials_current
    description: >
      stg_clinical_trials filtered to the latest ingest_date — the
      snapshot's sole input surface. One row per nct_id (bare nct_id IS
      unique at this grain). Adds snapshot_source='live' so rows the
      snapshot captures from here are distinguishable from the synthetic
      day-0 seed all the way into the marts.
    columns:
      - name: nct_id
        data_type: varchar
        description: ClinicalTrials.gov registry identifier (NCTxxxxxxxx).
        data_tests:
          - unique
          - not_null
      - name: brief_title
        data_type: varchar
        description: Short public title of the study.
      - name: overall_status
        data_type: varchar
        description: Recruitment/lifecycle status as reported by the API.
      - name: phase
        data_type: varchar
        description: Trial phase(s) joined with "/"; "NA" not applicable.
      - name: sponsor_name
        data_type: varchar
        description: Lead sponsor name.
      - name: conditions
        data_type: varchar[]
        description: >
          List of condition strings; empty list when absent. duckdb
          type; ARRAY on the snowflake target.
      - name: interventions
        data_type: varchar[]
        description: >
          List of intervention names; empty list when absent. duckdb
          type; ARRAY on the snowflake target.
      - name: start_date_raw
        data_type: varchar
        description: Start date exactly as the API sent it; null if absent.
      - name: start_date
        data_type: date
        description: Normalized start date; null when absent/unparseable.
      - name: date_precision
        data_type: varchar
        description: '"day" or "month"; null when absent or unrecognized.'
      - name: why_stopped
        data_type: varchar
        description: Free-text stop reason; only some stopped trials.
      - name: has_results
        data_type: boolean
        description: Whether the registry has posted results.
      - name: ingest_date
        data_type: date
        description: The latest partition date (single value here).
        data_tests:
          - not_null
      - name: snapshot_source
        data_type: varchar
        description: Constant 'live' — provenance label for the snapshot.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - live
