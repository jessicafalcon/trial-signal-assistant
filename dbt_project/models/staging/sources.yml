version: 2

sources:
  - name: parsed
    description: >
      Parquet written by ingest/parse_to_parquet.py (the bridge from the
      tested Python parser). dbt never re-parses raw JSON; this is the
      single entry point for trial data. Dual-target: duckdb reads the
      parquet path via external_location (meta below); snowflake reads
      the COPY INTO'd table RAW.TRIALS. The conditionals in THIS FILE
      branch only on target.type — a compile-time constant from
      profiles.yml, not an env var — so the SPEC-02 injection
      constraint holds here; the load macro hardcodes its identifiers
      for the same reason.
    schema: "{{ 'raw' if target.type == 'snowflake' else 'main' }}"
    config:
      meta:
        # duckdb-only (snowflake ignores meta): cwd-relative like the
        # duckdb path in profiles.yml — dbt and sqlfluff both run from
        # the repo root. Deliberately a fixed literal (no env_var): a
        # dynamic value here lands inside a SQL string and is an
        # injection surface. CI symlinks data/parsed -> parsed_fixtures
        # instead of parameterizing this.
        external_location: >-
          read_parquet('data/parsed/ingest_date=*/trials.parquet')
    tables:
      - name: clinical_trials
        identifier: "{{ 'trials' if target.type == 'snowflake' else 'clinical_trials' }}"
        description: >
          One row per study per ingest_date partition; columns mirror
          TrialRecord exactly, plus ingest_date.
        # freshness is the one deliberately time-dependent check in
        # the project (DECISIONS.md observability-slice entry): warn
        # past the daily cadence + a day of grace, error at a week.
        # Run via make freshness / freshness-snowflake — live only;
        # CI's fixture partition is pinned to 2026-08-14 and would be
        # eternally stale by design. The cast covers both targets
        # (the bridge stores ingest_date as a string).
        loaded_at_field: cast(ingest_date as timestamp)
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
