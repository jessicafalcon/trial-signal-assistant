repos:
  - repo: local
    hooks:
      - id: secrets-audit
        name: secrets audit (deterministic floor)
        entry: scripts/secrets_audit.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3  # v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 8108cc202d2aa2732b21d48507152c95ee244030  # 4.3.0
    hooks:
      - id: sqlfluff-lint
        stages: [pre-commit]
        # dbt templater needs dbt itself inside the hook's isolated env
        additional_dependencies:
          - sqlfluff-templater-dbt==4.3.0
          - dbt-duckdb==1.11.0
