repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        # dbt templater needs dbt itself inside the hook's isolated env
        additional_dependencies:
          - sqlfluff-templater-dbt==4.3.0
          - dbt-duckdb==1.11.0
